    const {error}=await sb.auth.updateUser({password:a,data:{pw_changed:true}});
    if(error){ if(/sub claim|does not exist|not found|session/i.test(error.message)){await sb.auth.signOut(); showLogin("Phiên đăng nhập cũ đã hết hiệu lực. Bạn đăng nhập lại."); return;}
      $("er").textContent=/same|different/i.test(error.message)?"Mật khẩu mới phải khác mật khẩu được cấp.":"Không đổi được mật khẩu: "+error.message;return;}
    const {data:{session:s2}}=await sb.auth.getSession(); start(s2);};

async function showVerify(){

async function showEnroll(){

  $("f3").onsubmit=async e=>{e.preventDefault(); $("er").textContent="";

    if(ch.error){$("er").textContent="Không gửi được yêu cầu, thử lại.";return;}
    const v=await sb.auth.mfa.verify({factorId:d.id,challengeId:ch.data.id,code:$("cd").value.trim()});

async function logout(){ await sb.auth.signOut(); DATA={A:[],B:[]}; state.files={}; showLogin(); }
async function route(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return;}
  /* Phiên của tài khoản đã bị xóa/tạo lại: đăng xuất để đăng nhập lại */
  const u=await sb.auth.getUser(); if(u.error||!u.data||!u.data.user){await sb.auth.signOut(); showLogin(); return;}
  const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal.currentLevel==="aal2"){start(session);return;}
  /* Chỉ tài khoản quản trị phải dùng Google Authenticator; người xem chỉ cần mật khẩu */
  const isAdm=await sb.from("admins").select("user_id").eq("user_id",session.user.id);
  if(!(isAdm.data&&isAdm.data.length)){start(session);return;}
  if(aal.nextLevel==="aal2"){showVerify();}
  else {showEnroll();}
}

function fileLabel(n,i,isOld){
  if(isOld) return "HĐ cũ đã thay thế";
  const p=stem(n).split("_"); const sc=p[2]||"";
  if(/^BBTL/.test(sc)) return "Biên bản thanh lý";
  if(/^PL/.test(sc)) return sc.replace(/-HD.*$/,"").replace("PLHD","PLHĐ ");
  if(/^ThoaThuan/.test(sc)) return "Thỏa thuận";
  return i===0 ? "Hợp đồng" : "Tài liệu kèm";
}
function i0(n,h){ return h.files[0]===n; }
function filesHtml(h){
  const L=[...h.files.map((n,i)=>[n,fileLabel(n,i,false)]), ...(h.cu||[]).map(n=>[n,fileLabel(n,0,true)])];
  if(!L.length) return "";
  return `<div class="files">${L.map(([n,l])=>state.files[stem(n)]
     ? `<button class="btn ${i0(n,h)?"rd":"rd2"}" data-open="${esc(stem(n))}" title="${esc(n)}">Đọc ${esc(l.toLowerCase())}</button>`

function hit(h,p){
  if(state.f!=="all"&&h.k!==state.f) return false;
  if(state.pj&&p.ten!==state.pj) return false;

  return (p.ten+" "+(h.nd||"")+" "+(h.so||"")+" "+(h.da||[]).join(" ")).toLowerCase().includes(q);

function hhState(d){ /* dd/mm/yyyy -> 'het' | 'sap' | '' */
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d||""); if(!m) return "";
  const t=new Date(+m[3],+m[2]-1,+m[1]), now=new Date(); now.setHours(0,0,0,0);
  const days=(t-now)/864e5; return days<0?"het":days<=30?"sap":"";
}
function blHtml(lbl,b){
  if(!b) return "";

  const parts=[so, b.nh&&esc(b.nh), b.gt!=null&&money(b.gt)].filter(Boolean).join(" · ");

/* Tải hàng loạt: chọn các file PDF trong thư mục "HĐ scan 2 dấu", trang tự ghép theo tên file */
function knownFiles(){ const s=new Set(); for(const t of ["A","B"]) for(const p of DATA[t]) for(const h of p.hd) for(const n of [...h.files,...(h.cu||[])]) s.add(n); return s; }
async function bulkUpload(list){
  if(!state.canWrite||!list.length) return;
  const known=knownFiles(); const box=$("upbox"), log=$("uplog"); box.hidden=false; log.textContent="";
  const files=[...list]; let ok=0, skip=0, bad=0;
  for(let i=0;i<files.length;i++){
    const file=files[i]; $("uptitle").textContent=`Đang tải ${i+1}/${files.length}…`;
    if(!known.has(file.name)){ skip++; log.textContent+=`Bỏ qua (không có trong danh mục): ${file.name}\n`; continue; }
    if(state.files[stem(file.name)]){ skip++; log.textContent+=`Đã có trên web: ${file.name}\n`; continue; }
    const up=await sb.storage.from("hopdong").upload(file.name,file,{upsert:true,contentType:"application/pdf"});
    if(up.error){ bad++; log.textContent+=`LỖI ${file.name}: ${up.error.message}\n`; continue; }
    const r=await sb.from("hop_dong_file").upsert({key:stem(file.name),path:file.name,ten_file:file.name,updated_at:new Date().toISOString()});
    if(r.error){ bad++; log.textContent+=`LỖI lưu thông tin ${file.name}: ${r.error.message}\n`; continue; }
    state.files[stem(file.name)]={key:stem(file.name),path:file.name,ten_file:file.name}; ok++;
  }
  $("uptitle").textContent=`Xong: tải lên ${ok} file, bỏ qua ${skip}, lỗi ${bad}.`;
  $("bulkin").value=""; render();
}
$("bulkin").addEventListener("change",e=>bulkUpload(e.target.files));

function loadScript(src){ return new Promise((ok,ng)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ng(new Error("Không tải được thư viện Excel")); document.head.appendChild(s); }); }
function toDate(s){ const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s||"").trim()); return m ? new Date(Date.UTC(+m[3],+m[2]-1,+m[1])) : null; }
function blTxt(b){ b=b&&{...b,so:b.so&&String(b.so).replace(/chờ anh bổ sung/gi,"Chờ bổ sung")}; if(!b) return ""; if(/^(Chờ|Không)/.test(b.so||"") && b.nh==null && b.gt==null && !b.hh) return ""; if(/^HĐ (có )?yêu cầu/.test(b.so||"")) return "HĐ có yêu cầu BL - chờ bổ sung"; return [b.so&&!/^(Chờ|HĐ yêu cầu|Không)/.test(b.so)?"Số "+b.so:(b.so||""), b.nh, b.gt!=null?Number(b.gt).toLocaleString("vi-VN"):"", b.hh&&"Hết hạn "+b.hh].filter(Boolean).join("; "); }
function signedOnly(list){ return list.map(p=>({...p,hd:p.hd.filter(h=>h.k!=="none")})).filter(p=>p.hd.length); }
const XGHI = {ok:"", tl:"Đã thanh lý, chờ ký lại"};
/* Năm ký: ưu tiên h.nam (anh chỉ định, từ nam_ky_bo_sung.json), rồi năm của ngày ký, rồi năm trong số HĐ (/20xx) */
function namKy(h){ if(h.nam) return String(h.nam); const d=/(\d{4})\s*$/.exec(String(h.ngay||"").trim()); if(d) return d[1];
  const m=/\/(20\d\d)/.exec(String(h.so||"")); return m?m[1]:null; }
function buildWorkbook(ExcelJS, A, Bb, note){
  const wb=new ExcelJS.Workbook(); wb.creator="Stellar - Phòng Đấu thầu";
  /* Gộp theo dự án: thứ tự dự án theo A-B, dự án chỉ có B-B' xếp sau, "Các Hợp đồng khác" cuối cùng */
  const pm=new Map();
  for(const [loai,list] of [["A-B",A],["B-B'",Bb]]) for(const p of signedOnly(list)){
    if(!pm.has(p.ten)) pm.set(p.ten,[]); for(const h of p.hd) pm.get(p.ten).push([loai,h]); }
  const names=[...pm.keys()].sort((x,y)=>(x==="Các Hợp đồng khác")-(y==="Các Hợp đồng khác"));
  addSheet(wb,"Theo dõi HĐ","BẢNG THEO DÕI HỢP ĐỒNG",note,names,pm,()=>true);
  /* Sheet theo năm ký (2024, 2025, 2026...): chỉ các năm có HĐ; HĐ chưa xác định được năm không vào sheet năm nào */
  const years=[...new Set([...pm.values()].flat().map(([,h])=>namKy(h)).filter(Boolean))].sort();
  for(const y of years) addSheet(wb,y,`BẢNG THEO DÕI HỢP ĐỒNG KÝ NĂM ${y}`,note,names,pm,h=>namKy(h)===y);
  return wb;
}
function addSheet(wb,sheetName,title,note,names,pm,keep){
  const ws=wb.addWorksheet(sheetName,{pageSetup:{paperSize:9,orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,
    margins:{left:3/2.54,right:2/2.54,top:2/2.54,bottom:2/2.54,header:0.3,footer:0.3},printTitlesRow:"4:4"}});
  const F={name:"Times New Roman",size:12,color:{argb:"FF000000"}};
  const B={style:"thin",color:{argb:"FF000000"}}, BD={top:B,left:B,bottom:B,right:B};
  const cols=[["TT",6],["Loại HĐ",10],["Dự án",16],["Bên giao thầu",22],["Bên nhận thầu",22],["Phạm vi công việc",45],["Số hợp đồng",24],
    ["Ngày ký",13],["Giá trị HĐ (đồng)",19],["Giá trị tạm ứng",18],["Ghi chú",22],["Bảo lãnh tạm ứng",18],["Bảo lãnh thực hiện HĐ",18]];
  ws.columns=cols.map(([,w])=>({width:w}));
  const n=cols.length, cGT=9, cTU=10, cGC=11, L=c=>ws.getColumn(c).letter;
  const fmtRow=(row,bold)=>{ for(let i=1;i<=n;i++){ const c=row.getCell(i); c.font={...F,bold:!!bold}; c.border=BD; c.alignment={vertical:"top",wrapText:true}; } };
  ws.mergeCells(1,1,1,n); ws.getCell(1,1).value=title;
  ws.getCell(1,1).font={...F,size:14,bold:true}; ws.getCell(1,1).alignment={horizontal:"center"};
  ws.mergeCells(2,1,2,n); ws.getCell(2,1).value=note; ws.getCell(2,1).font={...F,italic:true};
  const hr=ws.getRow(4); cols.forEach(([t],i)=>hr.getCell(i+1).value=t); fmtRow(hr,true);
  for(let i=1;i<=n;i++) hr.getCell(i).alignment={horizontal:"center",vertical:"middle",wrapText:true};
  let r=5, tt=0; const first=r;
  for(const ten of names){
    const items=pm.get(ten).filter(([,h])=>keep(h)); if(!items.length) continue;
    const nA=items.filter(x=>x[0]==="A-B").length, nB=items.length-nA;
    const row=ws.getRow(r++);
    row.getCell(6).value=`${ten} (`+[nA?`${nA} HĐ A-B`:"", nB?`${nB} HĐ B-B'`:""].filter(Boolean).join(", ")+")";
    fmtRow(row,true);
    for(const [loai,h] of items){
      const x=ws.getRow(r); tt++;
      const nd=h.nd||""; const i=nd.indexOf(" – ");
      const giao = h.bgt || (loai==="A-B" ? "" : "Stellar");
      const nhan = h.bnt || (loai==="A-B" ? "Stellar" : (i>0 ? nd.slice(0,i).trim() : ""));
      const pv = loai==="A-B" ? nd : (i>0 ? nd.slice(i+3).trim() : nd);
      [tt, loai, ten, giao, nhan, pv, h.so||(h.ask?"Chờ bổ sung":""), toDate(h.ngay)||h.ngay||"",
       h.gt==null?(h.ask?"Chờ bổ sung":null):h.gt, h.tu!=null?h.tu:(h.tu_txt||null), h.k in XGHI ? XGHI[h.k] : (ST[h.k]||""),
       loai==="A-B"?"":blTxt(h.blt), loai==="A-B"?"":blTxt(h.blh)]
        .forEach((val,j)=>x.getCell(j+1).value=typeof val==="string"?val.replace(/chờ anh bổ sung/gi,"Chờ bổ sung"):val);
      fmtRow(x);
      [1,2,8].forEach(c=>x.getCell(c).alignment={horizontal:"center",vertical:"top"});
      x.getCell(8).numFmt="dd/mm/yyyy";
      [cGT,cTU].forEach(c=>{ x.getCell(c).numFmt="#,##0"; x.getCell(c).alignment={horizontal:"right",vertical:"top"}; });
      if(h.ask) [7,cGT].forEach(c=>{ if(x.getCell(c).value==="Chờ bổ sung") x.getCell(c).font={...F,color:{argb:"FFFF0000"}}; });
      r++;
    }
  }
  /* Hàng tổng: SUMIFS theo cột Loại HĐ và Ghi chú trên vùng dữ liệu (dòng dự án không có Loại HĐ nên không bị cộng) */
  const last=Math.max(r-1,first), rg=c=>`$${L(c)}$${first}:$${L(c)}$${last}`;
  const tot=[["Tổng giá trị HĐ A-B",rg(2),'"A-B"'],["Tổng giá trị HĐ B-B'",rg(2),`"B-B'"`],["Giá trị HĐ đã thanh lý",rg(cGC),'"Đã thanh lý*"']];
  for(const [lb,crg,crit] of tot){
    const t=ws.getRow(r++); t.getCell(6).value=lb; fmtRow(t,true);
    for(const c of [cGT,cTU]){ const x=t.getCell(c); x.value={formula:`SUMIFS(${rg(c)},${crg},${crit})`}; x.numFmt="#,##0"; x.alignment={horizontal:"right",vertical:"top"}; }
  }
  ws.autoFilter={from:{row:4,column:1},to:{row:4,column:n}};
  ws.views=[{state:"frozen",ySplit:4}];
}
async function exportExcel(){
  const btn=$("xls");
  btn.disabled=true; btn.textContent="Đang xuất…";
  try{
    if(!window.ExcelJS) await loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js");
    const d=new Date(), dd=n=>String(n).padStart(2,"0");
    const ngay=`${dd(d.getDate())}/${dd(d.getMonth()+1)}/${d.getFullYear()}`, ymd=`${String(d.getFullYear()).slice(2)}${dd(d.getMonth()+1)}${dd(d.getDate())}`;
    const wb=buildWorkbook(window.ExcelJS, DATA.A, DATA.B, `Ngày xuất: ${ngay}. Danh mục cập nhật: ${META.updated}. Không gồm hợp đồng chưa ký. Đơn vị: đồng.`);
    const buf=await wb.xlsx.writeBuffer();
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download=`TheoDoiHD_${ymd}.xlsx`; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  }catch(e){ $("msg").hidden=false; $("msg").textContent="Không xuất được file Excel: "+e.message; }
  finally{ btn.disabled=false; btn.textContent="Xuất Excel"; }
}
$("xls").onclick=exportExcel;
$("out").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){openFile(o.dataset.open);return;}
  if(e.target.closest(".list")) return;
  const c=e.target.closest(".card>button"); if(!c) return;
  const k=c.parentElement.dataset.p; state.open.has(k)?state.open.delete(k):state.open.add(k); render();
});
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ showLogin(); } });
route();
</script>
