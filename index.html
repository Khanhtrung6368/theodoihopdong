/* Bố cục: thanh tiêu đề, dải lọc theo trạng thái, lưới thẻ theo dự án (bấm để mở danh sách hợp đồng), chế độ Bảng theo từng hợp đồng. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --fg:#14213d; --muted:#5b6678; --line:#d9dde4;
  --accent:#1f4e8c; --accent-soft:#e6eef8; --on-accent:#ffffff;
  --ok:#1b7a4b; --ok-bg:#e3f3ea;
  --warn:#9a5b00; --warn-bg:#fbefd5;
  --info:#3b5a8f; --info-bg:#e6ecf7;
  --bad:#a52a2a; --bad-bg:#f8e4e4;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --surface:#172034; --fg:#e8ecf4; --muted:#9aa5ba; --line:#2a3550;
  --accent:#7fb0ee; --accent-soft:#1e2c47; --on-accent:#0d1a2e;
  --ok:#6fd3a0; --ok-bg:#16352a; --warn:#f0bd6a; --warn-bg:#3a2d12;
  --info:#9db8ea; --info-bg:#1f2c49; --bad:#f19a9a; --bad-bg:#3d1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --surface:#172034; --fg:#e8ecf4; --muted:#9aa5ba; --line:#2a3550;
  --accent:#7fb0ee; --accent-soft:#1e2c47; --on-accent:#0d1a2e;
  --ok:#6fd3a0; --ok-bg:#16352a; --warn:#f0bd6a; --warn-bg:#3a2d12;
  --info:#9db8ea; --info-bg:#1f2c49; --bad:#f19a9a; --bad-bg:#3d1c1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:24px 0 16px;border-bottom:2px solid var(--fg)}
.brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font-size:24px;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}

.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip .n{font-family:var(--mono);margin-left:6px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);flex:0 1 220px;min-width:0}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 11px;border-radius:6px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex}
.seg .btn:first-child{border-radius:6px 0 0 6px}.seg .btn:last-child{border-radius:0 6px 6px 0;border-left:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13px;color:var(--muted);padding-bottom:12px}
.summary b{color:var(--fg);font-family:var(--mono);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.card>button{all:unset;display:block;width:100%;box-sizing:border-box;padding:14px 16px;cursor:pointer}
.card>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ct h2{margin:0;font-size:16px;font-weight:600}
.caret{color:var(--muted);font-size:12px;transition:transform .15s}
.card.open .caret{transform:rotate(90deg)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;padding:1px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.s-signed{background:var(--ok-bg);color:var(--ok)}
.s-resign{background:var(--warn-bg);color:var(--warn)}
.s-nodate{background:var(--info-bg);color:var(--info)}
.s-none{background:var(--bad-bg);color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)}
.kv span:last-child{font-family:var(--mono);color:var(--fg);text-align:right}
.list{border-top:1px solid var(--line);padding:4px 16px 12px}
.card:not(.open) .list{display:none}
.hd{padding:10px 0;border-bottom:1px dashed var(--line)}
.hd:last-of-type{border-bottom:0}
.hd .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hd .nd{font-weight:600;font-size:13px}
.so{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.hd .r2{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:4px;font-size:12px;color:var(--muted)}
.hd .r2 .v{font-family:var(--mono);color:var(--fg)}
.note{font-size:12px;color:var(--muted);margin-top:2px}
.thieu{margin-top:8px;font-size:12px;color:var(--bad)}
.pic{font-size:12px;color:var(--muted);margin-top:8px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:2px solid var(--fg);background:var(--surface);font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
td.m{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
tr.pj td{background:var(--accent-soft);font-weight:600}
.empty{padding:32px 0;text-align:center;color:var(--muted)}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}
@media (max-width:520px){h1{font-size:20px}.meta{text-align:left}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}

.tabs{display:flex;gap:10px;margin-top:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:15px;font-weight:700;background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent);padding:9px 20px;border-radius:8px;cursor:pointer}
.tab:hover{filter:brightness(0.96)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 6px rgba(31,78,140,.25)}
#tAB{--tc:#43a047;--tcs:#e6f4ea;--tsh:rgba(67,160,71,.3)}
#tBB{--tc:#e53935;--tcs:#fdeaea;--tsh:rgba(229,57,53,.3)}
#tAB,#tBB{background:var(--tcs);border-color:var(--tc);color:#000}
#tAB[aria-selected="true"],#tBB[aria-selected="true"]{background:var(--tc);color:#000;box-shadow:0 2px 6px var(--tsh)}
.s-todo{background:var(--line);color:var(--muted)}
.s-doing{background:var(--warn-bg);color:var(--warn)}
.s-done{background:var(--ok-bg);color:var(--ok)}
.prog{display:flex;gap:2px;margin-top:8px}
.prog i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.prog i.d{background:var(--ok)}
.prog i.c{background:var(--warn)}
.steps{margin-top:8px;display:grid;gap:4px}
.stp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.stp input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.stp input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);width:128px}
.stp.cur .lb{font-weight:600}
.stp .lb{min-width:0}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:10px}
.hd .ben{font-size:12px;color:var(--muted);margin-top:2px}
.auth{max-width:380px;margin:12vh auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.auth[hidden],.wrap[hidden]{display:none}
.auth h2{margin:0 0 6px;font-size:20px}.auth p{color:var(--muted);font-size:13px;margin:0 0 12px}
.auth label{display:block;font-size:13px;margin:10px 0 4px}
.auth input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.auth .btn{margin-top:14px;width:100%}
.auth .qr{display:block;margin:8px auto;width:180px;height:180px;background:#fff}
.auth .sec{font-family:var(--mono);font-size:12px;text-align:center;overflow-wrap:anywhere;color:var(--muted);margin-bottom:8px}
.auth .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
.auth .lnk{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;margin-top:12px;cursor:pointer;padding:0}
.who{margin-top:6px;font-size:12px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.doc{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.up{cursor:pointer;display:inline-block}

.s-ok{background:var(--ok-bg);color:var(--ok)}
.s-tl{background:var(--info-bg);color:var(--info)}
.s-mot{background:var(--warn-bg);color:var(--warn)}
.s-chua{background:var(--bad-bg);color:var(--bad)}
.s-none{background:var(--line);color:var(--muted)}
select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:220px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.files .btn{font-size:12px;padding:3px 9px}
.btn.rd{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.rd:hover{filter:brightness(1.1)}
.btn.rd2{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.rd2:hover{filter:brightness(0.97)}
.files .off{font-size:12px;color:var(--muted);padding:3px 0}
.ask{color:var(--bad)}
.upbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px}
.upbox[hidden]{display:none}
.upbox .log{font-family:var(--mono);font-size:12px;max-height:180px;overflow:auto;margin-top:8px;white-space:pre-wrap;color:var(--muted)}

<script>
const SB_URL = "https://gvjhhvhderpszhgnreto.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2amhodmhkZXJwc3poZ25yZXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MDQxMjksImV4cCI6MjEwOTE4MDEyOX0.xG7iYyyY3wiuJjfvYiyQQca42obHqrpgSmYkPtamjgw";

let DATA = {A:[], B:[]};

const TABS = {ab:{sub:"Hợp đồng A-B (Stellar với chủ đầu tư), theo dự án", key:"A"}, bb:{sub:"Hợp đồng B-B' (thầu phụ, chuyên gia và các hợp đồng khác), theo dự án", key:"B"}};

const state = {tab:"ab", f:"all", pj:"", q:"", show:true, view:"card", open:new Set(), files:{}, canWrite:false};
const $ = id => document.getElementById(id);
const fmt = n => n==null ? "—" : Math.round(n).toLocaleString("vi-VN");

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const T = () => TABS[state.tab];

/* ---------- Đăng nhập, mật khẩu, mã Authenticator ---------- */
function authView(html){ $("app").hidden=true; const a=$("auth"); a.hidden=false; a.innerHTML=html; }
function showLogin(err){
  authView(`<h2>Theo dõi hợp đồng</h2><p>Đăng nhập bằng tài khoản được cấp quyền.</p>
  <form id="f1"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Mật khẩu</label><input id="pw" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Đăng nhập</button><div class="err" id="er">${esc(err||"")}</div></form>`);
  $("f1").onsubmit=async e=>{e.preventDefault(); $("er").textContent="";
    const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(error){$("er").textContent="Sai email hoặc mật khẩu.";return;}
    route();};
}
function showChange(forced,session){
  authView(`<h2>Đổi mật khẩu</h2><p>${forced?"Lần đầu đăng nhập, bạn đặt mật khẩu mới.":"Nhập mật khẩu mới."} Tối thiểu 6 ký tự.</p>
  <form id="f5"><label for="p1">Mật khẩu mới</label><input id="p1" type="password" autocomplete="new-password" minlength="6" required>
  <label for="p2">Nhập lại mật khẩu mới</label><input id="p2" type="password" autocomplete="new-password" minlength="6" required>
  <button class="btn" type="submit">Lưu mật khẩu</button><div class="err" id="er"></div></form>${forced?"":'<button class="lnk" id="bk">Quay lại</button>'}`);
  if(!forced) $("bk").onclick=()=>start(session);
  $("f5").onsubmit=async e=>{e.preventDefault(); $("er").textContent="";
    const a=$("p1").value,b=$("p2").value;
    if(a!==b){$("er").textContent="Hai mật khẩu không giống nhau.";return;}
    if(a.length<6){$("er").textContent="Mật khẩu cần tối thiểu 6 ký tự.";return;}
    const {error}=await sb.auth.updateUser({password:a,data:{pw_changed:true}});
    if(error){ if(/sub claim|does not exist|not found|session/i.test(error.message)){await sb.auth.signOut(); showLogin("Phiên đăng nhập cũ đã hết hiệu lực. Bạn đăng nhập lại."); return;}
      $("er").textContent=/same|different/i.test(error.message)?"Mật khẩu mới phải khác mật khẩu được cấp.":"Không đổi được mật khẩu: "+error.message;return;}
    const {data:{session:s2}}=await sb.auth.getSession(); start(s2);};
}
async function showVerify(){
  const {data:fl}=await sb.auth.mfa.listFactors();
  const f=(fl&&fl.totp||[])[0];
  if(!f){showEnroll();return;}
  authView(`<h2>Mã Google Authenticator</h2><p>Nhập mã 6 số trong ứng dụng Authenticator.</p>
  <form id="f2"><label for="cd">Mã xác thực</label><input id="cd" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
  <button class="btn" type="submit">Xác nhận</button><div class="err" id="er"></div></form><button class="lnk" id="lo">Đăng xuất</button>`);
  $("lo").onclick=logout;
  $("f2").onsubmit=async e=>{e.preventDefault(); $("er").textContent="";
    const ch=await sb.auth.mfa.challenge({factorId:f.id});
    if(ch.error){$("er").textContent="Không gửi được yêu cầu, thử lại.";return;}
    const v=await sb.auth.mfa.verify({factorId:f.id,challengeId:ch.data.id,code:$("cd").value.trim()});
    if(v.error){$("er").textContent="Mã sai hoặc đã hết hạn.";return;}
    route();};
}
async function showEnroll(){
  const {data:fl}=await sb.auth.mfa.listFactors();
  for(const x of (fl&&fl.all||[])) if(x.factor_type==="totp"&&x.status==="unverified") await sb.auth.mfa.unenroll({factorId:x.id});
  const en=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"Authenticator"});
  if(en.error){showLogin("Không tạo được mã Authenticator: "+en.error.message);return;}
  const d=en.data;
  authView(`<h2>Cài Google Authenticator</h2><p>Lần đầu đăng nhập, quét mã QR bằng ứng dụng Google Authenticator rồi nhập mã 6 số.</p>
  <img class="qr" alt="Mã QR Authenticator" src="${d.totp.qr_code}"><div class="sec">${esc(d.totp.secret)}</div>
  <form id="f3"><label for="cd">Mã 6 số</label><input id="cd" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
  <button class="btn" type="submit">Xác nhận</button><div class="err" id="er"></div></form><button class="lnk" id="lo">Đăng xuất</button>`);
  $("lo").onclick=logout;
  $("f3").onsubmit=async e=>{e.preventDefault(); $("er").textContent="";
    const ch=await sb.auth.mfa.challenge({factorId:d.id});
    if(ch.error){$("er").textContent="Không gửi được yêu cầu, thử lại.";return;}
    const v=await sb.auth.mfa.verify({factorId:d.id,challengeId:ch.data.id,code:$("cd").value.trim()});
    if(v.error){$("er").textContent="Mã sai hoặc đã hết hạn.";return;}
    route();};
}
async function logout(){ await sb.auth.signOut(); DATA={A:[],B:[]}; state.files={}; showLogin(); }
async function route(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return;}
  /* Phiên của tài khoản đã bị xóa/tạo lại: đăng xuất để đăng nhập lại */
  const u=await sb.auth.getUser(); if(u.error||!u.data||!u.data.user){await sb.auth.signOut(); showLogin(); return;}
  const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal.currentLevel==="aal2"){start(session);return;}
  /* Chỉ tài khoản quản trị phải dùng Google Authenticator; người xem chỉ cần mật khẩu */
  const isAdm=await sb.from("admins").select("user_id").eq("user_id",session.user.id);
  if(!(isAdm.data&&isAdm.data.length)){start(session);return;}
  if(aal.nextLevel==="aal2"){showVerify();}
  else {showEnroll();}
}

/* ---------- Dữ liệu ---------- */
async function loadAll(){
  const [d,f]=await Promise.all([ sb.from("du_lieu").select("id,payload"), sb.from("hop_dong_file").select("key,path,ten_file") ]);
  if(d.error||!d.data||!d.data.length){return false;}
  DATA={A:[],B:[]};
  d.data.forEach(r=>{ if(r.id==="ab")DATA.A=r.payload; if(r.id==="bb")DATA.B=r.payload; });
  state.files={}; (f.data||[]).forEach(r=>state.files[r.key]=r);
  return true;
}
async function start(session){
  const meta=session.user.user_metadata||{};
  const isAdm=await sb.from("admins").select("user_id").eq("user_id",session.user.id);
  state.canWrite=!!(isAdm.data&&isAdm.data.length);
  if(!meta.pw_changed && !state.canWrite){showChange(true,session);return;}
  $("auth").hidden=true; $("app").hidden=false;
  $("who").textContent=session.user.email;
  const ok=await loadAll();
  $("msg").hidden=ok; if(!ok) $("msg").textContent="Không tải được dữ liệu. Tài khoản chưa được cấp quyền hoặc chưa qua bước Authenticator.";
  $("upd").textContent=META.updated;
  if(location.hash==="#bb") state.tab="bb";
  render();
}

/* ---------- Giao diện ---------- */
function fileLabel(n,i,isOld){
  if(isOld) return "HĐ cũ đã thay thế";
  const p=stem(n).split("_"); const sc=p[2]||"";
  if(/^BBTL/.test(sc)) return "Biên bản thanh lý";
  if(/^PL/.test(sc)) return sc.replace(/-HD.*$/,"").replace("PLHD","PLHĐ ");
  if(/^ThoaThuan/.test(sc)) return "Thỏa thuận";
  return i===0 ? "Hợp đồng" : "Tài liệu kèm";
}
function i0(n,h){ return h.files[0]===n; }
function filesHtml(h){
  const L=[...h.files.map((n,i)=>[n,fileLabel(n,i,false)]), ...(h.cu||[]).map(n=>[n,fileLabel(n,0,true)])];
  if(!L.length) return "";
  return `<div class="files">${L.map(([n,l])=>state.files[stem(n)]
     ? `<button class="btn ${i0(n,h)?"rd":"rd2"}" data-open="${esc(stem(n))}" title="${esc(n)}">Đọc ${esc(l.toLowerCase())}</button>`
     : `<span class="off" title="${esc(n)}">${esc(l)}: chưa tải lên web</span>`).join("")}</div>`;
}
function hit(h,p){
  if(state.f!=="all"&&h.k!==state.f) return false;
  if(state.pj&&p.ten!==state.pj) return false;
  const q=state.q.trim().toLowerCase(); if(!q) return true;
  return (p.ten+" "+(h.nd||"")+" "+(h.so||"")).toLowerCase().includes(q);
}
function visibleProjects(){ return lst().map(p=>({...p,hd:p.hd.filter(h=>hit(h,p))})).filter(p=>p.hd.length); }
function renderChips(){
  const all=lst().flatMap(p=>p.hd.filter(h=>!state.pj||p.ten===state.pj));
  const defs=[["all","Tất cả"],...Object.entries(ST)];
  const cnt=k=>k==="all"?all.length:all.filter(h=>h.k===k).length;
  $("chips").innerHTML=defs.filter(([k])=>k==="all"||cnt(k)).map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${state.f===k}">${l}<span class="n">${cnt(k)}</span></button>`).join("");
  const names=lst().map(p=>p.ten);
  $("pj").innerHTML=`<option value="">Tất cả dự án (${names.length})</option>`+names.map(n=>`<option ${n===state.pj?"selected":""}>${esc(n)}</option>`).join("");
}
function lineHtml(h){
  return `<div class="hd"><div class="r1"><div><div class="nd">${esc(h.nd||"—")}</div><div class="so ${h.ask?"ask":""}">${esc(h.so||(h.ask?"Chờ bổ sung số HĐ":"Chưa có số hợp đồng"))}</div></div><span class="tag s-${h.k}">${ST[h.k]}</span></div>
  <div class="r2"><span>Ngày ký: ${esc(h.ngay||"—")}</span><span class="v ${h.ask&&h.gt==null?"ask":""}">${h.gt==null&&h.ask?"Chờ bổ sung":money(h.gt)}</span></div>
  ${filesHtml(h)}</div>`;
}
function renderCards(ps){
  if(!ps.length){$("out").innerHTML=`<div class="empty">Không tìm thấy hợp đồng phù hợp.</div>`;return;}
  $("out").innerHTML=`<div class="grid">${ps.map(p=>{
    const open=state.open.has(p.ten);
    const tags=Object.keys(ST).map(k=>{const n=p.hd.filter(h=>h.k===k).length;return n?`<span class="tag s-${k}">${n} ${ST[k].toLowerCase()}</span>`:""}).join("");
    return `<article class="card ${open?"open":""}" data-p="${esc(p.ten)}">
      <button aria-expanded="${open}"><div class="ct"><h2>${esc(p.ten)}</h2><span class="caret">▶</span></div>
      <div class="tags">${tags}</div>
      <div class="kv"><span>${p.hd.length} hợp đồng</span><span>${money(total(p.hd))}</span></div></button>
      <div class="list">${p.hd.map(lineHtml).join("")}</div></article>`}).join("")}</div>`;
}
function renderTable(ps){
  if(!ps.length){$("out").innerHTML=`<div class="empty">Không tìm thấy hợp đồng phù hợp.</div>`;return;}
  $("out").innerHTML=`<div class="tw"><table><thead><tr><th>Dự án</th><th>Nội dung</th><th>Số hợp đồng</th><th>Tình trạng</th><th>Ngày ký</th><th class="num">Giá trị HĐ</th><th>Bản scan</th></tr></thead><tbody>${ps.map(p=>
    `<tr class="pj"><td colspan="5">${esc(p.ten)} · ${p.hd.length} hợp đồng</td><td class="num m">${money(total(p.hd))}</td><td></td></tr>`+
    p.hd.map(h=>{const f=h.files[0]&&state.files[stem(h.files[0])];return `<tr><td></td><td>${esc(h.nd||"—")}</td><td class="m ${h.ask?"ask":""}">${esc(h.so||(h.ask?"Chờ bổ sung":"—"))}</td><td><span class="tag s-${h.k}">${ST[h.k]}</span></td><td>${esc(h.ngay||"—")}</td><td class="num m">${money(h.gt)}</td><td>${f?`<button class="btn rd" data-open="${esc(stem(h.files[0]))}">Đọc</button>`:(h.files.length?"Chưa tải":"—")}</td></tr>`}).join("")).join("")}</tbody></table></div>`;
}
function render(){

  renderChips();
  const ps=visibleProjects(), hd=ps.flatMap(p=>p.hd), tl=hd.filter(h=>h.k==="tl");
  $("summary").innerHTML=`<span>Dự án <b>${ps.length}</b></span><span>Hợp đồng <b>${hd.length}</b></span><span>Tổng giá trị <b>${money(total(hd))}</b></span>${tl.length?`<span>Trong đó đã thanh lý <b>${money(total(tl))}</b></span>`:""}`;
  $("all").hidden=state.view!=="card";
  $("all").textContent=ps.length&&ps.every(p=>state.open.has(p.ten))?"Thu tất cả":"Mở tất cả";
  state.view==="card"?renderCards(ps):renderTable(ps);
  $("vCard").setAttribute("aria-pressed",state.view==="card");
  $("vTab").setAttribute("aria-pressed",state.view==="table");
  $("vis").setAttribute("aria-pressed",state.show);
  $("vis").textContent=state.show?"Ẩn giá trị":"Hiện giá trị";
  $("tAB").setAttribute("aria-selected",state.tab==="ab");
  $("tBB").setAttribute("aria-selected",state.tab==="bb");
  $("ro").hidden=state.canWrite; $("bulk").hidden=!state.canWrite;
}
function setTab(t){state.tab=t;state.f="all";state.pj="";state.q="";$("q").value="";state.open=new Set();render();try{history.replaceState(null,"","#"+t)}catch(e){}}
$("tAB").onclick=()=>setTab("ab"); $("tBB").onclick=()=>setTab("bb");
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){state.f=b.dataset.k;render()}});
$("pj").onchange=e=>{state.pj=e.target.value;state.f="all";if(state.pj)state.open.add(state.pj);render()};
$("q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("vis").onclick=()=>{state.show=!state.show;render()};
$("vCard").onclick=()=>{state.view="card";render()};
$("vTab").onclick=()=>{state.view="table";render()};
$("logout").onclick=logout;
$("chpw").onclick=async()=>{const {data:{session}}=await sb.auth.getSession();showChange(false,session)};
$("all").onclick=()=>{const ps=visibleProjects();const a=ps.every(p=>state.open.has(p.ten));ps.forEach(p=>a?state.open.delete(p.ten):state.open.add(p.ten));render()};

async function openFile(key){
  const f=state.files[key]; if(!f) return;
  const w=window.open("","_blank");
  const r=await sb.storage.from("hopdong").createSignedUrl(f.path,300);
  if(r.error||!r.data){ if(w) w.close(); $("msg").hidden=false; $("msg").textContent="Không mở được file hợp đồng. Phiên đăng nhập có thể đã hết hạn."; return; }
  if(w){ w.opener=null; w.location=r.data.signedUrl; } else { location.href=r.data.signedUrl; }
}
/* Tải hàng loạt: chọn các file PDF trong thư mục "HĐ scan 2 dấu", trang tự ghép theo tên file */
function knownFiles(){ const s=new Set(); for(const t of ["A","B"]) for(const p of DATA[t]) for(const h of p.hd) for(const n of [...h.files,...(h.cu||[])]) s.add(n); return s; }
async function bulkUpload(list){
  if(!state.canWrite||!list.length) return;
  const known=knownFiles(); const box=$("upbox"), log=$("uplog"); box.hidden=false; log.textContent="";
  const files=[...list]; let ok=0, skip=0, bad=0;
  for(let i=0;i<files.length;i++){
    const file=files[i]; $("uptitle").textContent=`Đang tải ${i+1}/${files.length}…`;
    if(!known.has(file.name)){ skip++; log.textContent+=`Bỏ qua (không có trong danh mục): ${file.name}\n`; continue; }
    if(state.files[stem(file.name)]){ skip++; log.textContent+=`Đã có trên web: ${file.name}\n`; continue; }
    const up=await sb.storage.from("hopdong").upload(file.name,file,{upsert:true,contentType:"application/pdf"});
    if(up.error){ bad++; log.textContent+=`LỖI ${file.name}: ${up.error.message}\n`; continue; }
    const r=await sb.from("hop_dong_file").upsert({key:stem(file.name),path:file.name,ten_file:file.name,updated_at:new Date().toISOString()});
    if(r.error){ bad++; log.textContent+=`LỖI lưu thông tin ${file.name}: ${r.error.message}\n`; continue; }
    state.files[stem(file.name)]={key:stem(file.name),path:file.name,ten_file:file.name}; ok++;
  }
  $("uptitle").textContent=`Xong: tải lên ${ok} file, bỏ qua ${skip}, lỗi ${bad}.`;
  $("bulkin").value=""; render();
}
$("bulkin").addEventListener("change",e=>bulkUpload(e.target.files));
$("out").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){openFile(o.dataset.open);return;}
  if(e.target.closest(".list")) return;
  const c=e.target.closest(".card>button"); if(!c) return;
  const k=c.parentElement.dataset.p; state.open.has(k)?state.open.delete(k):state.open.add(k); render();
});
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ showLogin(); } });
route();
</script>
</body></html>
